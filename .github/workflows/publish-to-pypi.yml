name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run core test suite
        run: python -m pytest tests -q --tb=short --junitxml=core-test-results.xml

      - name: Run Secret Source plugin tests
        if: always()
        run: python -m pytest plugins/hermes-vault-secret-source/tests -q --tb=short --junitxml=plugin-test-results.xml

      - name: Run Desktop plugin tests
        if: always()
        run: python -m pytest plugins/hermes-vault-desktop/tests -q --tb=short --junitxml=desktop-plugin-test-results.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            core-test-results.xml
            plugin-test-results.xml
            desktop-plugin-test-results.xml
          if-no-files-found: warn

  pypi-publish:
    name: Build and upload release to PyPI
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-vault
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
